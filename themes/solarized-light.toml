[formatting]
# IRC color remap from https://github.com/lancewillett/colloquial-lance (Colloquial-Lance.css)
# Active: only colors whose Halloy default is unreadable on #FDF6E3 (contrast below 3:1).
# Each value also stays at 4.7:1 or better on the black chip bots put behind PROBLEM:/RECOVERY:.
white = "#969696"
orange = "#b26319"
yellow = "#91901b"
lightgreen = "#408c31"
lightcyan = "#048a8a"
pink = "#b559b1"
lightgrey = "#868686"
